  <path d="M350 90 Q370 70 390 90 Q370 110 350 90" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
  <path d="M500 110 Q520 90 540 110 Q520 130 500 110" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- Grape clusters -->
  <g transform="translate(150, 110)">
    <circle cx="0" cy="0" r="8" fill="#6A1B9A"/>
    <circle cx="10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="-10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="5" cy="15" r="8" fill="#6A1B9A"/>
    <circle cx="-5" cy="15" r="8" fill="#6A1B9A"/>
  </g>
  <g transform="translate(300, 120)">
    <circle cx="0" cy="0" r="8" fill="#6A1B9A"/>
    <circle cx="10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="-10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="5" cy="15" r="8" fill="#6A1B9A"/>
    <circle cx="-5" cy="15" r="8" fill="#6A1B9A"/>
  </g>
  <g transform="translate(450, 110)">
    <circle cx="0" cy="0" r="8" fill="#6A1B9A"/>
    <circle cx="10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="-10" cy="5" r="8" fill="#6A1B9A"/>
    <circle cx="5" cy="15" r="8" fill="#6A1B9A"/>
    <circle cx="-5" cy="15" r="8" fill="#6A1B9A"/>
  </g>
  
  <!-- Tendrils -->
  <path d="M180 100 C190 110, 190 120, 180 130" stroke="#4A3728" stroke-width="2" fill="none"/>
  <path d="M420 100 C410 110, 410 120, 420 130" stroke="#4A3728" stroke-width="2" fill="none"/>
